<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>My Carbon Trigger</title>
	<link rel="stylesheet" href="./styles.css" />
</head>

<body class="container">
	<img alt="plants and people" src="images/plants-people.png" />
	<div>
		<h1>Welcome to Your Personal Carbon Trigger!</h1>
	</div>

	<form class="form-data" autocomplete="on" novalidate>
		<div>
			<h2>New? Add your Information</h2>
		</div>
		<div>
			<label for="region">Region Name</label>
			<input type="text" id="region" required class="region-name" placeholder="e.g. US-NEISO"
				aria-describedby="region-feedback" />
			<small id="region-feedback" class="field-feedback" aria-live="polite"></small>
		</div>
		<div>
			<label for="api">Your API Key from tmrow</label>
			<div class="api-key-container">
				<input type="password" id="api" required class="api-key" autocomplete="off"
					aria-describedby="api-feedback" />
				<button type="button" class="toggle-api-key" aria-controls="api" aria-pressed="false">Show</button>
			</div>
			<small id="api-feedback" class="field-feedback" aria-live="polite"></small>
		</div>
		<button type="submit" class="search-btn">Submit</button>
	</form>

	<div class="result" hidden>
		<div class="loading" hidden>loading...</div>
		<div class="errors" role="alert" hidden></div>
		<div class="data"></div>
		<div class="result-container">
			<p><strong>Region: </strong><span class="my-region"></span></p>
			<p><strong>Carbon Usage: </strong><span class="carbon-usage"></span></p>
			<p><strong>Fossil Fuel Percentage: </strong><span class="fossil-fuel"></span></p>
		</div>
		<button type="button" class="clear-btn">Change region</button>
	</div>

	<script src="main.js"></script>
</body>

</html>
